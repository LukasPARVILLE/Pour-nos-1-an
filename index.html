<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Un an de nous</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Nunito:wght@400;500&display=swap">
<style>
:root{--bg:#F7F0EA;--l:#E8D0CB;--m:#C98A93;--s:#8F4A57;--d:#4A232E;--g:#E8B86D;--gt:#3D2A0A;color-scheme:light}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--d);font:16px Nunito,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.hw{font-family:Caveat,cursive;font-weight:500}
#app{min-height:100vh;display:flex;flex-direction:column;align-items:center;text-align:center;padding:clamp(48px,7vh,72px) clamp(10px,3vw,40px) 96px}
.adm #app{padding-bottom:170px}
#hs{position:fixed;inset:0;overflow:hidden;pointer-events:none}
#hs span{position:absolute;bottom:-30px;color:var(--m);opacity:0;animation:fl 10s linear infinite}
@keyframes fl{15%{opacity:.5}to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
#view{width:100%;max-width:1400px;position:relative;z-index:1}
.pg{animation:in .6s ease both}
@keyframes in{from{opacity:0}}
.stw{container-type:inline-size;width:100%}
.stage{position:relative;width:100%}
.it{position:absolute;animation:in .6s both}
.it p{margin:0;white-space:pre-wrap}
.ti{font-family:Caveat,cursive;font-weight:500;color:var(--s);line-height:1.05;text-align:center}
.tx{line-height:1.6;text-align:center}
.ph{aspect-ratio:4/5;background:var(--l) center/cover;display:flex;align-items:center;justify-content:center;font-size:3em;color:var(--m)}
.it .pol{width:100%;animation:dr 1s cubic-bezier(.3,1.5,.5,1) both}
@keyframes dr{from{translate:0 -60px;opacity:0}}
.pol{background:#fff;border:1px solid var(--l);padding:.5em .5em .3em}
.cap{font-family:Caveat,cursive;font-size:1.25em;line-height:1.2;margin-top:.3em}
.ctb{display:flex;gap:.3em;justify-content:center}
.bx{background:#fff;border:1px solid var(--l);border-radius:.4em;padding:.15em .3em;min-width:2.4em}
.bx b{display:block;font-size:1em;font-weight:500;line-height:1.2}
.bx i{font:.32em Nunito;color:var(--s);font-style:normal}
.bump{animation:bp .45s ease-out}
@keyframes bp{40%{transform:translateY(-.25em)}}
.jx{font-family:Caveat,cursive}
.jx span{display:inline-block;background:var(--g);color:var(--gt);border-radius:1em;padding:.05em .45em;white-space:nowrap}
.hd{position:absolute;z-index:3;width:30px;height:30px;border-radius:50%;background:var(--s);color:#fff;font:16px/30px sans-serif;text-align:center;display:none;touch-action:none;user-select:none;cursor:grab}
.it.on{outline:1.5px dashed var(--m);outline-offset:4px}
.it.on .hd{display:block}
.mv{left:-15px;top:-15px}.rt{left:calc(50% - 15px);top:-46px}.rs{right:-15px;bottom:-15px;cursor:nwse-resize}
.ed[contenteditable]{outline:1px dotted var(--m);outline-offset:2px;min-height:1em}
.tlbox{container-type:inline-size;width:100%}
.trk{display:flex;gap:clamp(24px,4vw,56px);width:max-content;max-width:100%;margin:0 auto 22px;overflow-x:auto;padding:14px 8px 8px;scrollbar-width:none}
.tn{position:relative;background:none;border:0;padding:0 6px;min-width:90px;color:var(--d);display:flex;flex-direction:column;align-items:center;gap:8px;flex:0 0 auto}
.tn::before{content:"";position:absolute;top:9px;left:-60px;right:-60px;height:2px;background:var(--l)}
.tn:first-child::before{left:50%}.tn:last-child::before{right:50%}
.dot{position:relative;z-index:1;width:20px;height:20px;border-radius:50%;background:var(--bg);border:2px solid var(--m);transition:.3s}
.tn.on .dot{background:var(--g);border-color:var(--s);transform:scale(1.35)}
.dl{font-size:14px;color:var(--s)}.tn.on .dl{font-weight:500;color:var(--d)}
.dts{display:grid;gap:16px 40px;justify-items:center;grid-template-areas:"t" "p" "r"}
.dts>div{display:flex;flex-direction:column;align-items:center;width:100%}
.gt{grid-area:t}.gp{grid-area:p}.gr{grid-area:r}
.dts .pol{width:100%;max-width:420px;padding:10px 10px 6px}
.dts .ph{aspect-ratio:1}
.ttl2{font-size:clamp(26px,5cqw,60px);color:var(--s);line-height:1.05;margin:0}
.dt{font-size:clamp(20px,3cqw,32px);color:var(--m);margin:0 0 6px}
.tx2{font-size:clamp(15px,2cqw,20px);line-height:1.7;max-width:52ch}
@container (min-width:640px){
 .dts{grid-template-columns:1fr 1fr;grid-template-areas:"p t" "p r";align-items:center}
 .dts .gt{align-self:end;align-items:flex-start;text-align:left}
 .dts .gr{align-self:start;align-items:flex-start;text-align:left}
}
.ctl{display:flex;gap:10px;margin-top:18px;justify-content:center;flex-wrap:wrap}
.btn2{background:#fff;color:var(--s);border:1px dashed var(--m);border-radius:20px;padding:8px 16px}
.di{font:inherit;border:1px solid var(--m);border-radius:8px;padding:6px 8px;background:#fff;margin-bottom:8px}
button{font:inherit;cursor:pointer}
.btn{background:var(--s);color:#fff;border:0;border-radius:24px;padding:10px 24px;font-size:17px;margin-top:24px;position:relative;z-index:1}
#bk,#lk{position:fixed;z-index:5;background:none;border:0;color:var(--s)}
#bk{left:14px;top:calc(12px + env(safe-area-inset-top));font-size:26px;opacity:.7}
#lk{right:12px;bottom:calc(10px + env(safe-area-inset-bottom));font-size:14px;opacity:.3}
#ab{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;background:var(--d);color:#fff;padding:8px 10px calc(8px + env(safe-area-inset-bottom));font-size:13px}
#ab button{background:var(--l);color:var(--d);border:0;border-radius:14px;padding:5px 12px}
#sb{display:flex;gap:8px}
#lg{position:fixed;inset:0;z-index:9;background:rgba(74,35,46,.45);display:flex;align-items:center;justify-content:center}
#lg>div{background:var(--bg);padding:18px;border-radius:14px;display:flex;gap:8px}
#lg input{border:1px solid var(--m);border-radius:8px;padding:8px;font:inherit;width:170px}
[hidden]{display:none!important}
#ld{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:48px;color:var(--m);animation:pu 1s infinite alternate}
@keyframes pu{to{transform:scale(1.2)}}
@media(prefers-reduced-motion:reduce){#hs{display:none}.it,.it .pol,.pg,.bump{animation:none}}
</style>
</head>
<body>
<div id="ld">♥</div>
<div id="hs"></div>
<button id="bk" hidden aria-label="Retour">←</button>
<main id="app"><div id="view"></div><button class="btn" id="nx" hidden></button></main>
<button id="lk" aria-label="Accès" title="Accès">🔒</button>
<div id="ab" hidden>
  <span id="st"></span><button id="sv" hidden>Enregistrer</button>
  <button data-add="ph">+ Photo</button><button data-add="ti">+ Titre</button><button data-add="tx">+ Texte</button>
  <span id="sb" hidden><button id="fm">A−</button><button id="fp">A+</button><button id="pc">Changer la photo</button><button id="dl">Supprimer</button></span>
  <span>Page <button id="hm">−</button><button id="hp">+</button></span><button id="qt">Quitter</button>
</div>
<div id="lg" hidden><div><input id="pw" type="password" placeholder="Mot de passe"><button class="btn" style="margin:0" id="go">OK</button></div></div>
<script>
const API="https://script.google.com/macros/s/AKfycbzjCdPi0lh8FFzLi1n-BGbl8_b2Jo1zDiNeK9idRV0JzVf5it9KfY8m6VwYp-fHNs2_FQ/exec";
const I=(id,k,w,s,o={})=>({id,k,g:{w,s},...o});
const gen=t=>({h:{w:56,s:176},it:[
  I("a","ph",{x:6,y:5,w:36,r:-3},{x:10,y:20,w:80,r:-3},{u:"",c:""}),
  I("b","ti",{x:50,y:8,w:44,r:0,f:4.6},{x:5,y:3,w:90,r:0,f:11},{c:t}),
  I("c","tx",{x:50,y:24,w:44,r:0,f:1.7},{x:7,y:134,w:86,r:0,f:4.2},{c:"Clique ici pour écrire ton texte."})]});
const D={
 hero:{h:{w:56,s:178},it:[
  I("a","ti",{x:52,y:6,w:44,r:0,f:4.6},{x:5,y:3,w:90,r:0,f:11.5},{c:"Bientôt, un an de nous"}),
  I("b","ph",{x:6,y:4,w:38,r:-3},{x:10,y:28,w:80,r:-3},{u:"",c:"nous (très beaux)"}),
  I("c","jx",{x:34,y:2,w:11,r:8},{x:68,y:25,w:24,r:8}),
  I("d","ct",{x:52,y:24,w:44,r:0},{x:4,y:141,w:92,r:0}),
  I("e","ti",{x:52,y:42,w:44,r:0,f:2.6},{x:5,y:163,w:90,r:0,f:7},{c:"Patience, ça se mérite."})]},
 pages:[
  {h:{w:85,s:240},it:[I("a","ti",{x:20,y:2,w:60,r:0,f:5},{x:5,y:2,w:90,r:0,f:11},{c:"Notre histoire"}),I("b","tl",{x:5,y:14,w:90,r:0},{x:2,y:18,w:96,r:0})]},
  gen("Statistiques"),gen("Nous"),gen("Ce que je ressens")],
 ev:[{d:"2026-06-08",t:"Le début de notre histoire",x:"Le 8 juin 2026, à 18h, tout a commencé. Clique sur ce texte pour raconter ce jour-là.",p:""}]};
let C={},U=Date.parse("2027-06-08T18:00:00+02:00"),off=0,adm=false,open=false,cur=0,sel=0,selId=null,pw=sessionStorage.getItem("pw")||"";
const $=s=>document.querySelector(s);
const api=b=>fetch(API,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify(b)}).then(r=>r.json());
const M=()=>innerWidth>=900?"w":"s";
const gm=it=>it.g[M()];
const P=()=>cur?C.pages[cur-1]:C.hero;
const now=()=>Date.now()+off;
const msg=t=>{$("#st").textContent=t};
const dirty=()=>{$("#sv").hidden=false};
const fd=d=>{const t=new Date(d+"T12:00:00");return isNaN(t)?"":t.toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"})};
const merge=s=>{
  const h=s.hero||{};
  C.hero=h.it?h:structuredClone(D.hero);
  if(!h.it&&h.url)C.hero.it.find(x=>x.k=="ph").u=h.url;
  C.pages=D.pages.map((d,i)=>{const p=(s.pages||[])[i];return p&&p.it?p:structuredClone(d)});
  C.ev=s.ev||(s.pages&&s.pages[0]&&s.pages[0].ev)||structuredClone(D.ev);
};

function bindT(e,o,k){
  e.textContent=o[k]||"";
  if(adm){try{e.contentEditable="plaintext-only"}catch(x){e.contentEditable=true}e.classList.add("ed");e.oninput=()=>{o[k]=e.innerText;dirty()}}
}
function bindP(e,o,k,click){
  if(o[k]){e.style.backgroundImage=`url(${o[k]})`;e.textContent=""}
  if(adm&&click){e.style.cursor="pointer";e.onclick=()=>pick(e,o,k)}
}

function geo(el,it){
  const g=gm(it),w=g.w,f=it.k=="ti"||it.k=="tx"?g.f:it.k=="ph"?w*.05:it.k=="ct"?w*.09:it.k=="jx"?w*.28:1;
  el.style.cssText=`left:${g.x}%;top:${g.y}cqw;width:${w}%;transform:rotate(${g.r||0}deg);font-size:${f}cqw`;
}

function mk(it){
  const el=document.createElement("div"),k=it.k;
  el.className="it "+k;el.dataset.id=it.id;
  el.innerHTML=k=="ph"?'<div class="pol"><div class="ph">♥</div><p class="cap"></p></div>'
   :k=="ti"||k=="tx"?"<p></p>"
   :k=="ct"?`<div class="ctb">${["jours","heures","minutes","secondes"].map((l,n)=>`<div class="bx" style="transform:rotate(${[-2,1.5,-1,2][n]}deg)"><b id="t${n}">0</b><i>${l}</i></div>`).join("")}</div>`
   :k=="jx"?'<span id="jx"></span>':'<div class="tlh"></div>';
  if(k=="ph"){bindP(el.querySelector(".ph"),it,"u");bindT(el.querySelector(".cap"),it,"c")}
  if(k=="ti"||k=="tx")bindT(el.querySelector("p"),it,"c");
  if(k=="tl")buildTL(el.querySelector(".tlh"));
  geo(el,it);
  if(adm){
    el.insertAdjacentHTML("beforeend",'<i class="hd mv">✥</i><i class="hd rt">↻</i><i class="hd rs">◢</i>');
    ctl(el,it);
    el.addEventListener("pointerdown",()=>select(it.id));
  }
  return el;
}

function ctl(el,it){
  const u=()=>el.parentNode.getBoundingClientRect().width/100;
  const dr=(h,fn)=>{h.onpointerdown=e=>{
    e.preventDefault();e.stopPropagation();select(it.id);h.setPointerCapture(e.pointerId);
    const g=gm(it),o={x:g.x,y:g.y,w:g.w,r:g.r||0},sx=e.clientX,sy=e.clientY;
    h.onpointermove=m=>{fn(g,o,m.clientX-sx,m.clientY-sy,m);geo(el,it)};
    h.onpointerup=()=>{h.onpointermove=h.onpointerup=null;dirty()};
  }};
  dr(el.querySelector(".mv"),(g,o,dx,dy)=>{g.x=o.x+dx/u();g.y=o.y+dy/u()});
  dr(el.querySelector(".rs"),(g,o,dx,dy)=>{const a=o.r*Math.PI/180;g.w=Math.max(4,Math.min(100,o.w+(dx*Math.cos(a)+dy*Math.sin(a))/u()))});
  dr(el.querySelector(".rt"),(g,o,dx,dy,m)=>{
    const b=el.getBoundingClientRect();
    let a=Math.atan2(m.clientY-(b.top+b.height/2),m.clientX-(b.left+b.width/2))*180/Math.PI+90;
    a=((a+540)%360)-180;g.r=Math.abs(a)<3?0:Math.round(a*10)/10;
  });
}

function select(id){
  selId=id;
  document.querySelectorAll(".it").forEach(e=>e.classList.toggle("on",e.dataset.id==id));
  const it=id&&P().it.find(x=>x.id==id);
  $("#sb").hidden=!it;
  if(it){
    $("#fm").hidden=$("#fp").hidden=!(it.k=="ti"||it.k=="tx");
    $("#pc").hidden=it.k!="ph";
    $("#dl").hidden=!["ph","ti","tx"].includes(it.k);
  }
}

function buildTL(box){
  const a=C.ev;
  if(sel>=a.length)sel=a.length-1;
  box.innerHTML=`<div class="tlbox"><div class="trk">${a.map((e,n)=>`<button class="tn${n==sel?" on":""}" data-n="${n}"><span class="dot"></span><span class="dl">${fd(e.d)}</span></button>`).join("")}</div><div class="dts"></div>${adm?'<div class="ctl"><button class="btn2 ad">+ Ajouter un moment</button><button class="btn2 rm">Supprimer ce moment</button></div>':""}</div>`;
  const dt=box.querySelector(".dts");
  const det=()=>{
    const e=C.ev[sel];
    dt.className="dts";void dt.offsetWidth;dt.className="dts pg";
    dt.innerHTML=`<div class="gt">${adm?`<input type="date" class="di" value="${e.d}">`:`<p class="hw dt">${fd(e.d)}</p>`}<p class="hw ttl2"></p></div><div class="gp"><div class="pol"><div class="ph">♥</div></div></div><div class="gr"><p class="tx2"></p></div>`;
    bindT(dt.querySelector(".ttl2"),e,"t");bindT(dt.querySelector(".tx2"),e,"x");bindP(dt.querySelector(".ph"),e,"p",true);
    if(adm)dt.querySelector(".di").onchange=z=>{e.d=z.target.value;a.sort((x,y)=>x.d.localeCompare(y.d));sel=a.indexOf(e);dirty();buildTL(box)};
  };
  det();
  box.querySelectorAll(".tn").forEach(b=>b.onclick=()=>{
    sel=+b.dataset.n;
    box.querySelectorAll(".tn").forEach(x=>x.classList.toggle("on",x==b));
    det();b.scrollIntoView({behavior:"smooth",inline:"center",block:"nearest"});
  });
  if(adm){
    box.querySelector(".ad").onclick=()=>{const n={d:new Date().toISOString().slice(0,10),t:"Nouveau moment",x:"Raconte ce moment…",p:""};a.push(n);a.sort((x,y)=>x.d.localeCompare(y.d));sel=a.indexOf(n);dirty();buildTL(box)};
    box.querySelector(".rm").onclick=()=>{if(a.length>1&&confirm("Supprimer ce moment ?")){a.splice(sel,1);sel=Math.max(0,sel-1);dirty();buildTL(box)}};
  }
}

function render(){
  const v=$("#view"),p=P();
  v.className="";void v.offsetWidth;v.className="pg";
  v.innerHTML=`<div class="stw"><div class="stage" style="height:${p.h[M()]}cqw"></div></div>`;
  const st=v.querySelector(".stage");
  p.it.forEach(it=>st.append(mk(it)));
  if(adm){
    st.onpointerdown=e=>{if(e.target==st)select(null)};
    select(null);
    msg("Édition ("+(M()=="w"?"PC":"téléphone")+") : ✥ déplacer, ↻ tourner, ◢ taille");
  }
  $("#bk").hidden=!(cur&&(adm||open));
  const nx=$("#nx");
  nx.hidden=adm?cur==4:!open;
  nx.textContent=!adm&&cur==0?"Commencer ♥":!adm&&cur==4?"Terminer ♥":"Suivant →";
  $("#lk").hidden=adm||cur>0;
  tick();
}

function tick(){
  const r=Math.max(0,Math.floor((U-now())/1000));
  if(!r&&!open){open=true;if(!adm)loadOpen()}
  if(!$("#t0"))return;
  [Math.floor(r/86400),Math.floor(r%86400/3600),Math.floor(r%3600/60),r%60].forEach((n,j)=>{
    const e=$("#t"+j),t=j?String(n).padStart(2,"0"):n;
    if(e.textContent!=t){e.textContent=t;if(j==3){e.classList.remove("bump");void e.offsetWidth;e.classList.add("bump")}}
  });
  const j=$("#jx");if(j)j.textContent="J-"+Math.ceil(Math.max(0,U-now())/864e5);
}

async function loadOpen(){
  const r=await api({a:"content"}).catch(()=>({}));
  if(r.ok)merge(r.c);
  if(cur==0)render();
}

function shrink(file){return new Promise(res=>{
  const im=new Image();
  im.onload=()=>{const s=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement("canvas");
    c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.85))};
  im.src=URL.createObjectURL(file);
})}

function pick(el,o,k){
  const f=document.createElement("input");f.type="file";f.accept="image/*";
  f.onchange=async()=>{
    if(!f.files[0])return;
    msg("Envoi de la photo…");
    try{
      const r=await api({a:"upload",pw,data:await shrink(f.files[0])});
      if(r.ok){o[k]=r.url;el.style.backgroundImage=`url(${r.url})`;el.textContent="";await save()}
      else msg("Échec de l’envoi");
    }catch(e){msg("Échec de l’envoi")}
  };
  f.click();
}

async function save(){
  msg("Enregistrement…");
  try{const r=await api({a:"save",pw,c:C});msg(r.ok?"Enregistré ♥":"Échec de l’enregistrement");if(r.ok)$("#sv").hidden=true}
  catch(e){msg("Échec de l’enregistrement")}
}

function add(k){
  const st=$(".stage"),u=st.getBoundingClientRect().width/100,y=Math.max(2,Math.round(-st.getBoundingClientRect().top/u+6));
  const d={ph:[{x:30,w:30,r:-3},{x:10,w:80,r:-3}],ti:[{x:20,w:60,r:0,f:5},{x:5,w:90,r:0,f:11}],tx:[{x:25,w:50,r:0,f:1.8},{x:7,w:86,r:0,f:4.2}]}[k];
  const it={id:Date.now().toString(36),k,g:{w:{y,...d[0]},s:{y,...d[1]}},...(k=="ph"?{u:"",c:""}:{c:k=="ti"?"Nouveau titre":"Écris ton texte ici."})};
  const p=P();
  p.it.push(it);
  for(const m of["w","s"])p.h[m]=Math.max(p.h[m],it.g[m].y+(k=="ph"?it.g[m].w*1.35:25));
  st.style.height=p.h[M()]+"cqw";
  const el=mk(it);st.append(el);select(it.id);dirty();
  if(k=="ph")pick(el.querySelector(".ph"),it,"u");
}
const cit=()=>P().it.find(x=>x.id==selId);
const cel=it=>document.querySelector(`.it[data-id="${it.id}"]`);
function fs(m){const it=cit(),g=gm(it);g.f=Math.round(g.f*m*100)/100;geo(cel(it),it);dirty()}
const hh=d=>{const p=P();p.h[M()]=Math.max(30,p.h[M()]+d);$(".stage").style.height=p.h[M()]+"cqw";dirty()};

document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>add(b.dataset.add));
$("#fm").onclick=()=>fs(1/1.1);
$("#fp").onclick=()=>fs(1.1);
$("#pc").onclick=()=>{const it=cit();pick(cel(it).querySelector(".ph"),it,"u")};
$("#dl").onclick=()=>{const it=cit();if(it&&confirm("Supprimer cet élément ?")){P().it=P().it.filter(x=>x!=it);cel(it).remove();select(null);dirty()}};
$("#hm").onclick=()=>hh(-10);
$("#hp").onclick=()=>hh(10);
$("#sv").onclick=save;
$("#qt").onclick=()=>{sessionStorage.removeItem("pw");location.reload()};
$("#bk").onclick=()=>{cur--;render()};
$("#nx").onclick=()=>{if(!adm&&cur==4){localStorage.setItem("seen","1");cur=0}else cur++;render()};
$("#lk").onclick=()=>{$("#lg").hidden=false;$("#pw").focus()};
$("#lg").onclick=e=>{if(e.target.id=="lg")e.target.hidden=true};
$("#pw").onkeydown=e=>{if(e.key=="Enter")$("#go").click()};
$("#go").onclick=async()=>{
  const p=$("#pw").value;
  const r=await api({a:"content",pw:p}).catch(()=>({}));
  if(r.ok){sessionStorage.setItem("pw",p);location.reload()}
  else{$("#pw").value="";$("#pw").placeholder="Non"}
};
let lm=M();
addEventListener("resize",()=>{if(M()!=lm){lm=M();render()}});

(async()=>{
  merge({});
  try{const r=await api({a:"pub"});U=r.unlock;off=r.now-Date.now();merge({hero:r.hero})}catch(e){}
  open=now()>=U;
  if(pw){try{const r=await api({a:"content",pw});if(r.ok){merge(r.c);adm=true}else sessionStorage.removeItem("pw")}catch(e){}}
  if(!adm&&open){try{const r=await api({a:"content"});if(r.ok)merge(r.c)}catch(e){}}
  if(adm){document.body.classList.add("adm");$("#ab").hidden=false}
  for(let i=0;i<8;i++){
    const s=document.createElement("span");s.textContent="♥";
    s.style.cssText=`left:${Math.random()*95}%;font-size:${14+Math.random()*14}px;animation-delay:${-Math.random()*10}s`;
    $("#hs").append(s);
  }
  render();$("#ld").remove();setInterval(tick,1000);
})();
</script>
